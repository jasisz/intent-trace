[project]
name = "intent-trace"
version = "0.1.0"
description = "Benchmark for measuring intent transmission through code diffs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "matplotlib>=3.8.0",
    "krippendorff>=0.8.2",
    "scipy>=1.17.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
